<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>截图区域选择</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
        background: transparent;
      }
      /* 屏幕截图铺满窗口 */
      #screen-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      /* 遮罩：4 块普通半透明 div 拼出选区外的暗区。
         不用巨大 box-shadow——那会在每次拖动时重新光栅化整屏面积，导致卡顿甚至卡死 */
      .dim {
        position: absolute;
        display: none;
        background: rgba(8, 10, 18, 0.55);
        pointer-events: none;
      }
      /* 选区：亮色边框 + 内侧白线 */
      #selection {
        position: absolute;
        display: none;
        border: 2px solid #4d6bfe;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.85);
      }
      /* 选区尺寸标签（物理像素） */
      #size-label {
        position: absolute;
        padding: 2px 8px;
        background: rgba(15, 17, 26, 0.92);
        color: #e6e8f0;
        font: 12px/1.6 'Segoe UI', 'Microsoft YaHei', sans-serif;
        border-radius: 4px;
        white-space: nowrap;
        transform: translateY(-120%);
      }
      /* 底部操作提示 */
      #hint {
        position: absolute;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        padding: 8px 18px;
        background: rgba(15, 17, 26, 0.85);
        color: #cfd3e0;
        font: 13px/1.5 'Segoe UI', 'Microsoft YaHei', sans-serif;
        border-radius: 999px;
        letter-spacing: 0.5px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="screen-img" alt="" />
    <div id="dim-top" class="dim"></div>
    <div id="dim-bottom" class="dim"></div>
    <div id="dim-left" class="dim"></div>
    <div id="dim-right" class="dim"></div>
    <div id="selection">
      <div id="size-label"></div>
    </div>
    <div id="hint">按住鼠标左键拖拽选择截图区域 · Esc 或右键取消</div>
    <script src="./overlay.js"></script>
  </body>
</html>
