<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>截图区域选择</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
        background: transparent;
      }
      /* 屏幕截图铺满窗口 */
      #screen-img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none;
      }
      /* 选区：亮色边框 + 巨大 box-shadow 把选区外的画面压暗 */
      #selection {
        position: absolute;
        display: none;
        border: 2px solid #4d6bfe;
        box-shadow:
          0 0 0 9999px rgba(8, 10, 18, 0.55),
          inset 0 0 0 1px rgba(255, 255, 255, 0.85);
      }
      /* 选区尺寸标签（物理像素） */
      #size-label {
        position: absolute;
        padding: 2px 8px;
        background: rgba(15, 17, 26, 0.92);
        color: #e6e8f0;
        font: 12px/1.6 'Segoe UI', 'Microsoft YaHei', sans-serif;
        border-radius: 4px;
        white-space: nowrap;
        transform: translateY(-120%);
      }
      /* 底部操作提示 */
      #hint {
        position: absolute;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        padding: 8px 18px;
        background: rgba(15, 17, 26, 0.85);
        color: #cfd3e0;
        font: 13px/1.5 'Segoe UI', 'Microsoft YaHei', sans-serif;
        border-radius: 999px;
        letter-spacing: 0.5px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <img id="screen-img" alt="" />
    <div id="selection">
      <div id="size-label"></div>
    </div>
    <div id="hint">按住鼠标左键拖拽选择截图区域 · Esc 或右键取消</div>
    <script src="./overlay.js"></script>
  </body>
</html>
